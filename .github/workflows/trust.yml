name: Trust Meter CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Self-audit (trust-meter measures itself)
        run: python -m trust_meter.cli . --phase "CI" --strict --json --output trust-report.json

      - name: Upload trust report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trust-report-py${{ matrix.python-version }}
          path: trust-report.json
