[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "trust-meter"
version = "0.2.1"
description = "Measure before you trust. Deterministic, local-first, evidence-backed trust scoring."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
trust-meter = "trust_meter.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["src/trust_meter"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/trust-meter-measure-v1.schema.json" = "trust_meter/schemas/trust-meter-measure-v1.schema.json"

[tool.hatch.build.targets.sdist]
only-include = [
    ".gitignore",
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "schemas/trust-meter-measure-v1.schema.json",
    "src/trust_meter",
]
exclude = [
    "/trust-report.html",
    "/trust-report.md",
]
