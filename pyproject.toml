[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trust-meter"
version = "0.1.0"
description = "Measure before you trust. Deterministic, local-first, evidence-backed trust scoring."
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
trust-meter = "trust_meter.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["src/trust_meter"]
